name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      # task format:check also checks cargo fmt; run only the Go formatting
      # gates here and leave Rust formatting to the oracle job.
      - run: |
          task install:gofumpt
          test -z "$(./bin/gofumpt -l .)"
          go mod tidy -diff
          go -C dev mod tidy -diff
      - run: task lint:vet
      - run: task lint:purego
      - run: task lint:govulncheck
      - run: task test
      - run: task test:386
      - run: task test:checkptr
      - run: task test:race
      - run: task fuzz:smoke
      - run: task bench:smoke
      - run: task mutation:gate
      - name: Verify static trace, coverage, generated-artifact, and MBT gates
        run: task verify:static

  oracle:
    name: rust and c++ differential oracles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-17
        with:
          toolchain: stable
          components: rustfmt
      - run: task oracle:test
