name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      # task format:check also checks cargo fmt; run only the Go formatting
      # gates here and leave Rust formatting to the oracle job.
      - run: |
          task install:gofumpt
          test -z "$(./bin/gofumpt -l .)"
          go mod tidy -diff
      - run: task lint:vet
      - run: task lint:purego
      - run: task lint:govulncheck
      - run: task test
      - run: task test:386
      - run: task test:checkptr
      - run: task test:race
      - run: task fuzz:smoke
      - run: task bench:smoke
      - run: task mutation:gate
      - run: task verify:rfc
      - run: task verify:generated

  oracle:
    name: rust and c++ differential oracles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: task oracle:test
