name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Verify Java-free artifacts and local trace oracles
        run: task verify:static
      - name: Model-check static specifications and ObjectDecoder cfg A/B
        run: task verify:tla
      - name: Require exact rejection of hand-authored formal mutations
        run: task verify:tla:negative
      - name: Replay the harvested corpus and legal witnesses through TLC
        run: task verify:trace:corpus
      - name: Require exact rejection of every machine-generated trace mutant
        run: task verify:trace:negative
      - name: Recheck the seeded production-fault trace
        run: task verify:trace:redteam
      - name: Verify deterministic model DOT and schedule regeneration
        run: task mbt:generate
      - name: Run Oracle 2 replay and model-trace coverage
        run: task mbt:oracle2

  release-gates:
    name: RFC-maximum release gates
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-17
        with:
          toolchain: stable
          components: rustfmt
      - run: task test:release
